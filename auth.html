<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Hub - Authentication</title>
    <link rel="stylesheet" href="style.css"> 
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    </head>
<body>
    <div class="auth-container">
        <a href="index.html" class="back-link">← Back to Home</a>
        
        <div class="auth-box">
            <div class="auth-tabs">
                <button id="loginTab" class="active">Login</button>
                <button id="signupTab">Sign Up</button>
            </div>
            
            <h2 id="authTitle">Create an Account</h2>
            
            <form id="authForm">
                <div class="input-group" id="usernameGroup">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="testing">
                </div>
                
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="mausamk93@gmail.com" required>
                </div>
                
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••" required>
                </div>
                
                <button type="submit" id="authSubmitBtn" class="btn-primary">Sign Up</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
